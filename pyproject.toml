[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-under-the-hood"
version = "0.1.0"
description = "Shared drawing layer for the Quantum Under The Hood notebooks"
requires-python = ">=3.11"
dependencies = ["numpy", "matplotlib"]

[tool.setuptools]
packages = ["qviz"]
